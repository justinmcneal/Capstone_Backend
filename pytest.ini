[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests accounts/tests
addopts = -v --tb=short --strict-markers
markers =
    anyio: asynchronous tests executed by the AnyIO pytest plugin
    real_mongo: tests that require an explicitly configured isolated MongoDB instance
    real_s3: tests that mutate an explicitly approved isolated S3 bucket/prefix
    real_clamav: tests that scan synthetic content with an explicitly approved ClamAV service
    deployment_integration: explicitly opted-in checks against deployment services
