name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  officer-contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out officer portal contract snapshot
        uses: actions/checkout@v4
        with:
          repository: eligabsoriano/Capstone-Web
          path: portal
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check officer review contract
        run: node portal/scripts/check-officer-contract.mjs --backend-schema ai_assistant/contracts/officer_review_brief.schema.json --web-root portal

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13.5']
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      DEBUG: "True"
      SECRET_KEY: stage9-ci-secret-key-32-bytes-long
      SECRET_PEPPER: stage9-ci-pepper
      MONGODB_URI: ""
      MONGODB_NAME: stage9_test_capstone
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      BLOCKCHAIN_ENABLED: "False"
      USE_REDIS_CACHE: "False"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement requirements.lock
          pip install --requirement requirements-ci.lock
          pip check

      - name: Run tests
        run: pytest -q

      - name: Run dependency audit
        run: pip-audit --strict --progress-spinner off

      - name: Run static security scan
        run: bandit --recursive accounts --exclude accounts/tests --severity-level high --confidence-level high

  real-mongo-auth:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      DEBUG: "True"
      SECRET_KEY: stage9-ci-secret-key-32-bytes-long
      SECRET_PEPPER: stage9-ci-pepper
      MONGODB_URI: ""
      MONGODB_NAME: stage9_test_capstone
      REAL_MONGO_TEST_URI: mongodb://127.0.0.1:27017
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      BLOCKCHAIN_ENABLED: "False"
      USE_REDIS_CACHE: "False"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement requirements.lock
          pip check
      - name: Run real-Mongo auth tests
        run: pytest -q tests/test_stage9_real_mongo.py -m real_mongo
